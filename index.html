<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>[hidden]{display:none!important}</style></head><body>

<title>NW Chicago Team Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800;6..12,900&display=swap">
<style>
  :root{
    color-scheme: dark;
    /* Paul Davis 2026 Brand Standards: black + PD Gold primary, warm grays accent, Emergency Red accent only */
    --bg:#000000; --panel:#141210; --panel2:#1E1B18; --line:#2E2A26;
    --ink:#FFFFFF; --muted:#D2CBC3; --dim:#887A6F; --accent:#B4985B; --gold-lt:#E8DFCF;
    --good:#5DB37E; --warn:#E39B2B; --bad:#ED1C24;
    --display:"Avenir Next","Avenir","Nunito Sans","Arial",sans-serif;
    --body:"Avenir Next","Avenir","Nunito Sans","Arial",sans-serif;
  }

  /* Light look: PD White ground, PD Black type, PD Gold accents, warm-gray panels */
  :root[data-look="light"]{
    color-scheme: light;
    --bg:#FFFFFF; --panel:#FAF8F5; --panel2:#F1ECE3; --line:#E3DDD5;
    --ink:#000000; --muted:#5E544C; --dim:#887A6F; --accent:#B4985B; --gold-lt:#6E5A2E;
    --good:#2F8F5B; --warn:#C07A00; --bad:#ED1C24;
  }
  :root[data-look="light"] .tile{box-shadow:0 1px 0 var(--line), 0 0 0 1px var(--line) inset}
  :root[data-look="light"] .win{background:var(--panel2)}
  :root[data-look="light"] h1 span{color:var(--ink)}
  :root[data-look="light"] .logo{height:clamp(155px,8.5vw,175px)}
  :root[data-look="light"] .clock small, :root[data-look="light"] .pace .row{color:var(--muted)}

  .spark{display:block;width:100%;height:clamp(20px,1.5vw,30px);overflow:visible;margin-top:1px}
  .spark .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .spark .goal-ln{stroke:var(--dim);stroke-width:1.5;stroke-dasharray:4 4;opacity:.8;vector-effect:non-scaling-stroke}
  .spark .proj{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
  .spark .hit{fill:transparent}
  .sparklbl{display:flex;justify-content:space-between;font-size:clamp(10px,.62vw,12px);color:var(--muted);line-height:1;margin-top:6px}
  .sparkwrap{position:relative}
  .sparkwrap .pt{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%)}
  .sparkwrap .pt.hollow{background:var(--panel);border:2px solid var(--accent);width:10px;height:10px;box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;
       padding-inline:clamp(16px,2vw,40px);padding-block:clamp(12px,1.6vw,28px);box-sizing:border-box}
  .wrap{display:flex;flex-direction:column;gap:clamp(12px,1.4vw,24px);min-height:100%}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px}
  .brand{display:flex;align-items:center;gap:clamp(16px,2vw,36px);flex-wrap:wrap}
  .logo{height:clamp(74px,6.2vw,124px);width:auto;display:block}
  .wordmark{font-family:var(--display);font-weight:900;color:var(--accent);font-size:clamp(22px,2vw,38px);letter-spacing:.02em;line-height:1}
  .wordmark small{display:block;font-weight:400;color:var(--muted);font-size:.45em;letter-spacing:.12em;margin-top:4px}
  .eyebrow{font-size:clamp(11px,.85vw,15px);font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,3.4vw,64px);line-height:1;margin:.1em 0 0;text-wrap:balance}
  h1 span{color:var(--gold-lt)}
  .meta{display:flex;align-items:flex-end;gap:clamp(16px,2.4vw,48px);flex-wrap:wrap}
  .pace{min-width:min(360px,100%)}
  .pace .row{display:flex;justify-content:space-between;font-size:clamp(12px,.95vw,17px);color:var(--muted);margin-bottom:6px;gap:12px}
  .pace .row b{color:var(--ink);font-weight:600}
  .bar{position:relative;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
  .clock{font-family:var(--display);font-weight:800;font-size:clamp(28px,2.8vw,54px);line-height:1;font-variant-numeric:tabular-nums}
  .clock small{display:block;font-family:var(--body);font-weight:400;font-size:clamp(11px,.85vw,15px);color:var(--muted);text-align:right;margin-top:4px}

  .board{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
         grid-template-rows:auto repeat(3,minmax(0,1fr)) auto minmax(0,1fr);gap:clamp(6px,.6vw,12px) clamp(10px,1.2vw,20px)}
  .board > *{min-width:0}
  .board h2.band2{margin-top:clamp(2px,.3vw,6px)}
  .board .tile{padding:clamp(8px,.75vw,14px) clamp(10px,.9vw,16px);gap:3px}
  .board .val{font-size:clamp(28px,2.5vw,48px)}
  .board .label{font-size:clamp(12px,.95vw,18px)}
  .vrow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:auto;flex-wrap:wrap}
  .vrow .val{margin-top:0}
  .vrow .chip{margin-bottom:.35em;margin-left:auto}
  .board .goal{font-size:clamp(11px,.85vw,15px)}
  .goal span:first-child{white-space:nowrap}
  .goal span:last-child{text-align:right}
  .board h2{margin:0;font-size:clamp(12px,1vw,18px);font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
          padding-bottom:8px;border-bottom:2px solid var(--accent)}
  .tile{flex:1;background:var(--panel);border-radius:10px;padding:clamp(12px,1.2vw,22px);display:flex;flex-direction:column;gap:8px;
        border-left:6px solid var(--line);min-height:0}
  .tile[data-s="good"]{border-left-color:var(--good)}
  .tile[data-s="warn"]{border-left-color:var(--warn)}
  .tile[data-s="bad"]{border-left-color:var(--bad)}
  .tile .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .tile .label{font-size:clamp(13px,1.1vw,21px);font-weight:500;line-height:1.2}
  .chip{flex:none;font-size:clamp(10px,.75vw,13px);font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;
        background:var(--panel2);color:var(--muted);white-space:nowrap}
  .tile[data-s="good"] .chip{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
  .tile[data-s="warn"] .chip{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
  .tile[data-s="bad"] .chip{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
  .val{font-family:var(--display);font-weight:900;font-size:clamp(40px,4.6vw,92px);line-height:.95;font-variant-numeric:tabular-nums;margin-top:auto}
  .val small{font-size:.4em;font-weight:600;color:var(--dim);margin-left:.15em}
  .goal{display:flex;justify-content:space-between;gap:8px;font-size:clamp(12px,.95vw,17px);color:var(--muted)}
  .goal b{color:var(--ink);font-weight:600}
  .prog{position:relative;height:8px;border-radius:4px;background:var(--line)}
  .prog i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--muted);max-width:100%}
  .tile[data-s="good"] .prog i{background:var(--good)}
  .tile[data-s="warn"] .prog i{background:var(--warn)}
  .tile[data-s="bad"] .prog i{background:var(--bad)}
  .prog u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.7;text-decoration:none}
  .win{background:var(--panel2);border-left-color:var(--accent)}
  .headline{flex:1 1 300px;max-width:560px;align-self:center;background:var(--panel2);border-left:6px solid var(--accent);border-radius:10px;padding:10px 16px}
  .headline[data-s="bad"]{border-left-color:var(--bad)} .headline[data-s="warn"]{border-left-color:var(--warn)} .headline[data-s="good"]{border-left-color:var(--good)}
  .headline .hl{font-size:clamp(11px,.8vw,14px);font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .headline .text{font-family:var(--display);font-weight:800;color:var(--gold-lt);font-size:clamp(16px,1.15vw,22px);line-height:1.2;margin-top:4px;text-wrap:balance}
  .headline .text b{font-weight:900;color:var(--ink)}
  .headline.has-detail{cursor:pointer} .headline.has-detail:hover,.headline.has-detail:focus-visible{outline:none;box-shadow:0 0 0 2px var(--accent)}
  .win .text{font-family:var(--display);font-weight:800;color:var(--gold-lt);font-size:clamp(18px,1.45vw,28px);line-height:1.15;margin-top:auto;text-wrap:balance}
  footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 24px;font-size:clamp(11px,.85vw,15px);color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
  .tagline{font-size:clamp(14px,1.2vw,22px);font-weight:600;color:var(--ink)}
  .tagline b{color:var(--accent);font-weight:600}
  footer .legend{display:flex;gap:18px;flex-wrap:wrap}
  footer .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c);vertical-align:-1px}
  .empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:clamp(16px,1.4vw,24px);padding:40px 0}
  .fsbtn{font:inherit;color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
  .fsbtn:hover,.fsbtn:focus-visible{color:var(--ink);border-color:var(--muted);outline:none}
  @media (max-width:1100px){.board{display:flex;flex-direction:column}.board .tile{flex:none}.board h2.band2{margin-top:12px}}
  @media (prefers-reduced-motion:no-preference){.prog i,.bar i{transition:width .8s ease}}
  .splitchip{display:flex;justify-content:flex-end}
  .splitrows{display:flex;flex-direction:column;gap:3px;margin-top:auto}
  .srow{display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:3px}
  .srow .nm{font-size:clamp(12px,.95vw,17px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .nm::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--line);vertical-align:0}
  .srow[data-s="good"] .nm::before{background:var(--good)} .srow[data-s="warn"] .nm::before{background:var(--warn)} .srow[data-s="bad"] .nm::before{background:var(--bad)}
  .srow .sv{font-family:var(--display);font-weight:900;font-size:clamp(17px,1.5vw,29px);line-height:1;font-variant-numeric:tabular-nums;text-align:right}
  .srow .sv small{font-size:.5em;font-weight:600;color:var(--dim);margin-left:.15em}
  .srow .sg{flex:1;font-size:clamp(10px,.72vw,13px);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

  const showLogo = () => { logo.hidden = false; $('wordmark').hidden = true; };
  if (logo.complete && logo.naturalWidth) showLogo(); else logo.addEventListener('load', showLogo);
  const fmtInt = n => Math.round(n).toLocaleString('en-US');
  const fmtUsd = n => '$' + Math.round(n).toLocaleString('en-US');

  function tick(){
    const d = new Date();
    $('clock').textContent = d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'});
    $('today').textContent = d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',timeZone:'America/Chicago'});
  }
  tick(); setInterval(tick, 15000);

  $('fs').addEventListener('click', () => {
    const el = document.documentElement;
    try { (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen()).catch(()=>{}); } catch(e){}
  });
  // Keep the TV awake where allowed
  async function wake(){ try{ if(navigator.wakeLock && document.visibilityState==='visible') await navigator.wakeLock.request('screen'); }catch(e){} }
  wake(); document.addEventListener('visibilitychange', wake);

  function status(k, pace){
    if (k.type === 'text') return {s:'', chip:''};
    if (typeof k.hit === 'boolean') return k.hit ? {s:'good', chip:'Hitting goal', pct:1} : {s:'bad', chip:'Missing goal', pct:0};
    const v = Number(k.value), g = Number(k.goal);
    if (!isFinite(v) || !isFinite(g)) return {s:'', chip:'No data', pct:0};
    if (k.direction === 'down'){
      // lower is better; goal is a ceiling
      const pct = g > 0 ? Math.max(0, Math.min(1, g / Math.max(v, 0.0001))) : (v <= 0 ? 1 : Math.max(0, 1 - v/ (k.scale || 20)));
      if (v <= g) return {s:'good', chip:'At goal', pct:1};
      const over = g > 0 ? v / g : v;
      if ((g > 0 && over <= 1.25) || (g === 0 && v <= (k.warnAt ?? 3))) return {s:'warn', chip:'Close', pct};
      return {s:'bad', chip:'Needs attention', pct};
    }
    const pct = g > 0 ? v / g : 0;
    if (pct >= 1) return {s:'good', chip:'Goal hit', pct:1};
    if (k.cumulative && pace != null){
      if (pct >= pace) return {s:'good', chip:'On pace', pct};
      if (pct >= pace * 0.8) return {s:'warn', chip:'Slightly behind', pct};
      return {s:'bad', chip:'Behind pace', pct};
    }
    if (pct >= 0.9) return {s:'warn', chip:'Close', pct};
    return {s:'bad', chip:'Below goal', pct};
  }

  function show(k){
    const v = Number(k.value);
    const fx = n => k.decimals ? Number(n).toFixed(k.decimals) : fmtInt(n);
    switch(k.unit){
      case 'mins': return fx(v) + '<small>min avg</small>';
      case 'hours': return fx(v) + '<small>hrs avg</small>';
      case 'usd': return fmtUsd(v);
      case 'pct': return fx(v) + '<small>%</small>';
      case 'days': return fx(v) + '<small>' + (k.avg ? 'days avg' : 'days') + '</small>';
      case 'rating': return v.toFixed(1) + '<small>★ average</small>';
      case 'pctOfGoal': return fmtInt(Number(k.goal) ? v / Number(k.goal) * 100 : 0) + '<small>% of goal</small>';
      default: return fmtInt(v);
    }
  }
  function showGoal(k){
    if (k.goalText) return k.goalText;
    if (k.unit === 'pctOfGoal') return 'Monthly goal';
    const g = Number(k.goal);
    const pre = k.direction === 'down' ? (g === 0 ? 'Goal ' : 'Goal ≤ ') : 'Goal ';
    switch(k.unit){
      case 'usd': return pre + fmtUsd(g);
      case 'pct': return pre + fmtInt(g) + '%';
      case 'days': return pre + fmtInt(g) + ' days';
      case 'rating': return 'Goal ' + (Number.isInteger(g) ? g : g.toFixed(1)) + '★';
      default: return pre + fmtInt(g);
    }
  }

  function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
  function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }


  // Trend line (sparkline) of monthly history; replaces the progress bar when a tile has >= 5 points
  function spark(k){
    const tr=k.trend; const vals=tr.values.slice(); const labels=tr.labels.slice();
    const cur = tr.current; const proj = (tr.proj!=null) ? tr.proj : null;
    const all = vals.concat([cur]); const n = all.length;
    const shown = proj!=null ? vals.concat([proj]) : all;
    const nums = shown.filter(v=>v!=null).concat(k.goal!=null?[Number(k.goal)]:[]);
    let mx=Math.max(...nums), mn=Math.min(0,...nums); if(mx<=mn) mx=mn+1; mx*=1.08;
    const W=400,H=100,P=4, x=i=>P+i*(W-2*P)/(n-1), y=v=>H-6-((v-mn)/(mx-mn))*(H-12);
    const fmt=v=>{ if(v==null) return '—'; const r=Number(v);
      return tr.unit==='usd' ? '$'+Math.round(r).toLocaleString('en-US') : tr.unit==='pct' ? Math.round(r)+'%' : Math.round(r).toLocaleString('en-US'); };
    let d='', pen=false;
    for(let i=0;i<n-1;i++){ const v=vals[i]; if(v==null){pen=false;continue;} d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1); pen=true; }
    const lastI=n-1, prevI=n-2, endV = proj!=null?proj:cur;
    let svg=`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(k.label)} by month">`;
    if(k.goal!=null && tr.showGoal!==false) svg+=`<line class="goal-ln" x1="${P}" x2="${W-P}" y1="${y(Number(k.goal))}" y2="${y(Number(k.goal))}"/>`;
    svg+=`<path class="ln" d="${d}"/>`;
    if(vals[prevI]!=null && endV!=null) svg+=`<line class="${proj!=null?'proj':'ln'}" x1="${x(prevI)}" y1="${y(vals[prevI])}" x2="${x(lastI)}" y2="${y(endV)}"/>`;
    for(let i=0;i<n;i++){ const isCur=i===lastI; const v=isCur?cur:vals[i];
      const t = isCur ? (proj!=null ? `${labels[i]} so far: ${fmt(cur)} · on pace for about ${fmt(proj)}` : `${labels[i]} so far: ${fmt(cur)}`) : `${labels[i]}: ${fmt(v)}`;
      svg+=`<rect class="hit" x="${x(i)-(W/n/2)}" y="0" width="${W/n}" height="${H}"><title>${esc(t)}</title></rect>`; }
    svg+='</svg>';
    const pct=(i,v)=>`left:${(x(i)/W*100).toFixed(2)}%;top:${(y(v)/H*100).toFixed(2)}%`;
    let pts='';
    // isolated points (gaps on both sides) get a dot so they aren't invisible
    for(let i=0;i<n-1;i++){ const v=vals[i]; if(v==null) continue; const iso=(i===0||vals[i-1]==null)&&(i===n-2||vals[i+1]==null); if(iso||i===prevI) pts+=`<i class="pt" style="${pct(i,v)}"></i>`; }
    if(endV!=null) pts+=`<i class="pt${proj!=null?' hollow':''}" style="${pct(lastI,endV)}"></i>`;
    const lbl = `<div class="sparklbl"><span>${esc(labels[0])}</span><span>${esc(labels[prevI])} ${fmt(vals[prevI])}</span><span>${esc(labels[lastI])} ${proj!=null?'~'+fmt(proj):fmt(cur)}</span></div>`;
    return el('div','sparkwrap', svg+pts+lbl);
  }


  // Split tile: one KPI broken out by division (e.g. time to inspect for mit / recon / mold)
  function splitStatus(k){
    const rank={good:0,warn:1,bad:2}; let worst='good', any=false;
    for (const p of k.parts){ if (p.value==null || p.value==='') continue; any=true; const s=status(Object.assign({direction:'down'},p)).s; if (rank[s]>rank[worst]) worst=s; }
    if (!any) return {s:'', chip:'Data pending'};
    return {s:worst, chip: worst==='good'?'All at goal':worst==='warn'?'Close':'Needs attention'};
  }
  function splitRows(k){
    const w = el('div','splitrows');
    for (const p of k.parts){
      const has = !(p.value==null || p.value==='');
      const s = has ? status(Object.assign({direction:'down'},p)).s : '';
      const r = el('div','srow'); if (s) r.dataset.s = s;
      const u = p.unit==='hours' ? 'hrs' : p.unit==='days' ? 'days' : p.unit==='mins' ? 'min' : '';
      const v = has ? Number(p.value).toFixed(p.decimals ?? (p.unit==='count' ? 0 : 1)) + (u ? `<small>${u}</small>` : '') : '—';
      const g = p.unit==='count' ? `goal ${esc(p.goal)}` : `≤ ${esc(p.goal)} ${u}`;
      r.innerHTML = `<span class="nm">${esc(p.name)}</span><span class="sg">${g}${p.note?' · '+esc(p.note):''}</span><span class="sv">${v}</span>`;
      w.appendChild(r);
    }
    return w;
  }

  function tile(k, pace){
    if (k.type === 'text'){
      const t = el('div','tile win');
      t.appendChild(el('div','top', `<div class="label">${esc(k.label)}</div>`));
      t.appendChild(el('div','text', esc(k.value || 'Every job, every note, every customer.')));
      return t;
    }
    const isSplit = k.type === 'split' && Array.isArray(k.parts);
    const st = isSplit ? splitStatus(k) : status(k, pace);
    const t = el('div','tile'); if (st.s) t.dataset.s = st.s;
    if (isSplit){
      t.appendChild(el('div','top', `<div class="label">${esc(k.label)}</div>`));
      if (st.chip) t.appendChild(el('div','splitchip', `<span class="chip">${esc(st.chip)}</span>`));
      t.appendChild(splitRows(k));
    } else {
    t.appendChild(el('div','top', `<div class="label">${esc(k.label)}</div>`));
    t.appendChild(el('div','vrow', `<div class="val">${show(k)}</div>${st.chip?`<span class="chip">${esc(st.chip)}</span>`:''}`));
    const note = k.note ? esc(k.note) : '';
    t.appendChild(el('div','goal', `<span><b>${esc(showGoal(k))}</b></span><span>${note}</span>`));
    const bar = el('div','prog', `<i style="width:${Math.max(2, Math.min(100, (st.pct||0)*100)).toFixed(1)}%"></i>${k.cumulative && pace!=null ? `<u style="left:calc(${(pace*100).toFixed(1)}% - 1px)"></u>`:''}`);
    const useTrend = k.trend && Array.isArray(k.trend.values) && (k.trend.values.length+1) >= 5;
    if (useTrend) t.appendChild(spark(k)); else if (typeof k.hit !== 'boolean') t.appendChild(bar);
    }
    return t;
  }

  function render(d){
    if (!d || !Array.isArray(d.sections)){ $('empty').textContent = 'Waiting for today’s numbers. They update every weekday morning.'; return; }
    $('month').textContent = d.month || 'This month';
    const day = Number(d.dayOfMonth), days = Number(d.daysInMonth);
    const pace = (day > 0 && days > 0) ? Math.min(1, day / days) : null;
    if (pace != null){
      $('pace').hidden = false;
      $('paceText').textContent = `Day ${day} of ${days} · ${days - day} days left`;
      $('paceBar').style.width = (pace*100).toFixed(1) + '%';
    }
    const hl = $('headline'), hk = d.headline;
    if (hk){
      hl.innerHTML = ''; hl.hidden = false;
      if (hk.type === 'text'){
        hl.appendChild(el('div','hl', esc(hk.label)));
        hl.appendChild(el('div','text', esc(hk.value)));
      } else {
        const st = status(hk, pace); if (st.s) hl.dataset.s = st.s;
        hl.appendChild(el('div','hl', esc(hk.label) + (hk.details ? ' ▸' : '')));
        hl.appendChild(el('div','text', '<b>' + show(hk).replace(/<small>.*<\/small>/,'') + '</b> ' + esc(hk.note || '')));
        if (hk.details && typeof openDetail === 'function'){
          hl.classList.add('has-detail'); hl.tabIndex = 0; hl.setAttribute('role','button');
          hl.onclick = () => openDetail(hk);
          hl.onkeydown = e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); openDetail(hk); } };
        }
      }
    }
    const board = $('board'); board.innerHTML = '';
    // Layout: band 1 = header row 1 + tile rows 2-4; band 2 = header row 5 + tile row 6
    d.sections.forEach((sec, si) => {
      const c = Number(sec.col) || (si % 5) + 1, band = Number(sec.band) === 2 ? 2 : 1, span = Math.max(1, Number(sec.span) || 1);
      const hr = band === 2 ? 5 : 1;
      const h = el('h2', band === 2 ? 'band2' : null, esc(sec.title));
      h.style.gridArea = `${hr} / ${c} / ${hr+1} / ${c+span}`;
      board.appendChild(h);
      (sec.kpis || []).forEach((k, i) => {
        const t = tile(k, pace);
        const tc = span > 1 ? c + (i % span) : c;
        const tr = band === 2 ? 6 : 2 + i;
        t.style.gridArea = `${tr} / ${tc} / ${tr+1} / ${tc+1}`;
        board.appendChild(t);
      });
    });
    board.hidden = false; $('empty').hidden = true;
    if (d.updatedAt){
      const u = new Date(d.updatedAt);
      $('updated').textContent = 'Updated ' + u.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'});
    }
  }

  let data = null;
  try { data = JSON.parse(document.getElementById('board-data').textContent); } catch(e){ data = null; }
  render(data);
  // Reload once an hour so a long-running TV picks up each morning's update
  setTimeout(() => location.reload(), 60*60*1000);
})();
</script>

</body></html>
